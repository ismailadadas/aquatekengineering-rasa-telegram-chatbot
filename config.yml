version: "3.1"
language: id

#fungsi file config.yml adalah untuk mengatur pipeline dan policies untuk nlu dan core chatbot.

#pipeline untuk NLU (Natural Language Understanding)
pipeline:
- name: WhitespaceTokenizer
- name: RegexFeaturizer
- name: LexicalSyntacticFeaturizer
- name: CountVectorsFeaturizer
  analyzer: char_wb
  min_ngram: 1
  max_ngram: 4
  #penting! dietclassifier otaknya nlu atau core
- name: DIETClassifier
  epochs: 100
  constrain_negatives: true
  constrain_similarities: true
- name: EntitySynonymMapper
- name: ResponseSelector
  epochs: 100
  constrain_similarities: true
#policies untuk Core (manajemen dialog)
policies:
- name: MemoizationPolicy
- name: RulePolicy
- name: TEDPolicy
  max_history: 5
  epochs: 100
  constrain_negatives: true
assistant_id: 20251117-142627-bare-agent
