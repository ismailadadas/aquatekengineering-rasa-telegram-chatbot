version: "3.1"

#fungsi rules.yml adalah untuk mendefinisikan aturan-aturan (rules) yang mengatur bagaimana chatbot merespons berbagai intent dari pengguna.

rules:

# --- ATURAN UNTUK GREET ---
# Aturan ini memastikan sapaan awal direspons.
- rule: Sambutan awal
  steps:
    - intent: greet
    - action: utter_greet

# --- ATURAN UNTUK GOODBYE ---
- rule: Say goodbye anytime the user says goodbye
  steps:
    - intent: goodbye
    - action: utter_goodbye
# --- ATURAN UNTUK THANK YOU ---
- rule: Say thank you
  steps:
    - intent: thank
    - action: utter_terima_kasih

# --- ATURAN-ATURAN UNTUK PERMINTAAN INFORMASI ---
- rule: Tangani permintaan komposisi
  steps:
  - intent: minta_komposisi
  - action: action_provide_komposisi

- rule: Tangani permintaan bahaya
  steps:
  - intent: minta_bahaya
  - action: action_provide_bahaya

- rule: Tangani permintaan P3K
  steps:
  - intent: minta_p3k
  - action: action_provide_p3k

- rule: Tangani permintaan Fungsi
  steps:
  - intent: minta_fungsi
  - action: action_provide_fungsi

- rule: Tangani permintaan penggunaan
  steps:
  - intent: minta_penggunaan
  - action: action_provide_informasi_penggunaan
