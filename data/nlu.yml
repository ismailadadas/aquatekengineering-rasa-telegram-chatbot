version: "3.1"

#Fungsi file untuk pelatihan NLU (Natural Language Understanding) chatbot, dan contoh-contoh pelatihan untuk masing-masing intent dan entity.

nlu:

#  INTENT: GREET

- intent: greet
#examples berfungsi sebagai data pelatihan 
  examples: |
    - halo
    - hi
    - hey
    - selamat siang
    - selamat sore
    - selamat pagi
    - assalamualaikum
    - mulai
    - hai bot
    - permisi
    - tes bot

#  INTENT: GOODBYE

- intent: goodbye
  examples: |
    - sampai jumpa
    - dadah
    - terima kasih ya
    - ok selesai
    - bye
    - makasih, udahan
    - cukup itu saja
    - sip makasih

# INTENT: THANK YOU

- intent: thank
  examples: |
    - terima kasih
    - makasih banyak
    - thanks
    - makasi ya bot
    - mantap makasih
    - oke makasih

# INTENT: MINTA KOMPOSISI

- intent: minta_komposisi
  examples: |
    - apa komposisi [HYTREAT 1200](produk)?
    - komposisi [1200](produk) apa?
    - jelasin kandungan [2200](produk)
    - bahan kimia dalam [5300](produk) apa aja?
    - [5700](produk) isinya apa?
    - komposisi dari produk [AQUA-SHIELD 221](produk)
    - sebutkan bahan [AQUA-SHIELD 320](produk)
    - bahan produk [620](produk) apa?
    - rincian bahan [630](produk)
    - tolong jelaskan komposisi [SULFURIC ACID](produk)
    - komposisi hytreat [1200](produk)
    - hytreat [1200](produk) komposisinya dong
    - bro komposisi [1200](produk) apa sih?

# INTENT: MINTA BAHAYA (HAZARD)

- intent: minta_bahaya
  examples: |
    - bahaya utama [HYTREAT 5300](produk)
    - apa saja hazard [1200](produk)?
    - tingkat bahaya [2200](produk)
    - apa kata sinyal [5300](produk)?
    - hazard dari [620](produk)
    - bahaya [AQUA-SHIELD 320](produk)
    - bahaya jika tertelan [5700](produk)
    - risiko menggunakan [221](produk)
    - bahaya dari [SULFURIC ACID](produk)
    - bahaya hytreat [1200](produk)
    - bahaya untuk hytreat [1200](produk)
    - jelasin bahaya hytreat [1200](produk)
    - saya mau tahu bahaya hytreat [1200](produk)
    - bro 1200 bahaya nggak?
    - yang 1200 hazardnya apa?
    - 1200 itu berbahaya ga?
    - produk [1200](produk) aman tidak?
    - bahaya kimia [5300](produk) apa?
    - bahaya aqua shield [620](produk)
    - bahaya untuk aqua shield [620](produk)
    - apa hazard aqua shield [620](produk)
    - jelasin bahaya aqua shield [620](produk)


# INTENT: MINTA P3K

- intent: minta_p3k
  examples: |
    - bagaimana P3K [1200](produk)?
    - pertolongan pertama untuk [2200](produk)
    - kalau kena mata [5300](produk) harus apa?
    - apa yang dilakukan jika tertelan [5700](produk)?
    - langkah darurat untuk [AQUA-SHIELD 320](produk)
    - pertolongan pertama [221](produk)
    - P3K [620](produk)
    - prosedur first aid [SULFURIC ACID](produk)
    - kalau kena kulit [1200](produk) gimana?
    - bro kalau kena mata [320](produk) gimana?


# INTENT: MINTA FUNGSI

- intent: minta_fungsi
  examples: |
    - apa fungsi [HYTREAT 5700](produk)?
    - kegunaan [AQUA-SHIELD 221](produk)
    - [AQUA-SHIELD 320](produk) itu buat apa?
    - fungsi [5300](produk) apa?
    - produk [1200](produk) gunanya apa?
    - manfaat dari [2200](produk)
    - jelaskan fungsi [620](produk)
    - [SULFURIC ACID](produk) dipakai untuk apa?
    - bro fungsi [630](produk) apa sih?


# INTENT: MINTA INFORMASI PENGGUNAAN

- intent: minta_penggunaan
  examples: |
    - cara pakai [320](produk)
    - bagaimana penggunaan [630](produk)
    - cara menangani [1200](produk)
    - cara simpan [5300](produk)
    - prosedur penggunaan [221](produk)
    - handling produk [620](produk)
    - bagaimana penyimpanan [5700](produk)?
    - penggunaan [SULFURIC ACID](produk) gimana?
    - bro cara pakai [1200](produk)

