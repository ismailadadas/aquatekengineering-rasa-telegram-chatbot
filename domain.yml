version: "3.1"

#Fungsi file ini adalah untuk mendefinisikan INTENTS, ENTITIES, SLOTS, RESPONSES, dan ACTIONS yang digunakan dalam chatbot.

# INTENTS (mendefinisikan intent yang dapat dikenali oleh chatbot)
intents:
  - greet
  - goodbye
  - thank
  - minta_komposisi
  - minta_bahaya
  - minta_p3k
  - minta_fungsi
  - minta_penggunaan 
  #- affirm affirm dan denny digunakan untuk konfirmasi, tapi di sini gak perlu (karena bot langsung jawab) khusus untuk story yang lebih kompleks
  #- deny

# ENTITIES (mendefinisikan entity yang dapat dikenali oleh chatbot)
entities:
  - produk

# SLOTS (mendefinisikan slot yang digunakan untuk menyimpan informasi selama percakapan)
slots:
  produk:
    type: any 
    influence_conversation: false
    mappings: 
      - type: from_entity
        entity: produk

# RESPONSES (mendefinisikan balasan yang diberikan oleh chatbot)
responses:
#utter responses berfungsi sebagai balasan chatbot
  utter_greet:
    - text: "Halo! Saya adalah Chatbot Informasi Keselamatan Bahan Kimia. Saya dapat memberikan data Komposisi, Bahaya, P3K, Fungsi, dan Informasi Penggunaan untuk produk HYTREAT dan AQUA-SHIELD serta SULFURIC ACID."

  utter_goodbye:
    - text: "Terima kasih sudah menggunakan layanan ini"

  utter_default:
    - text: "Maaf, saya tidak mengerti. Anda ingin informasi tentang produk yang mana? (Sebutkan Kode nya misalnya 1200, 5700, 320, atau SULFURIC ACID) dan apa (komposisi, bahaya, P3K, fungsi, atau informasi penggunaan)? Silakan ulangi."

  utter_terima_kasih:
    - text: "Sama-sama! Apa ada pertanyaan lain mengenai produk kami?"

  utter_minta_komposisi:
    - text: "Tolong sebutkan Kode produk (misalnya 1200, 5700, atau SULFURIC ACID) agar saya bisa memberikan komposisinya."
  
  utter_minta_bahaya:
    - text: "Tolong sebutkan Kode produk (misalnya 1200, 5700, atau SULFURIC ACID) agar saya bisa menjelaskan bahaya utamanya."

  utter_minta_p3k:
    - text: "Tolong sebutkan Kode produk (misalnya 1200, 5700, atau SULFURIC ACID) agar saya bisa memberikan informasi P3K."
    
  utter_minta_fungsi:
    - text: "Tolong sebutkan Kode produk (misalnya 1200, 5700, atau SULFURIC ACID) agar saya bisa menjelaskan fungsi atau kegunaannya."
    
  utter_minta_penggunaan: 
    - text: "Tolong sebutkan Kode produk (misalnya 1200, 5700, atau SULFURIC ACID) agar saya bisa memberikan informasi cara penggunaan dan penanganannya (handling)."

# ACTIONS (mendefenisikan custom actions yang akan digunakan)
actions:
  - action_provide_komposisi
  - action_provide_bahaya
  - action_provide_p3k
  - action_provide_fungsi
  - action_provide_informasi_penggunaan 